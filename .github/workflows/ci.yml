name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Run Linter
        run: |
          if npm run | grep -q 'lint'; then
            bun run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Run Type Check
        run: bun run build

      - name: Run Tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'testing_secret_key_for_ci' }}
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy_user:dummy_password@localhost:5432/dummy_db' }}
        run: bun run test
